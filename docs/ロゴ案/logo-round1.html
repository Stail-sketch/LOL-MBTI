<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>LOL診断 ロゴ案 ラウンド1</title>
<style>
  :root{--bg:#F0F0F0;--face:#FFFFFF;--ink:#000;--red:#FF0000}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Yu Gothic UI",sans-serif;padding:40px}
  h1{font-size:28px;font-weight:900;margin-bottom:32px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:0;border-top:2px solid #000;border-left:2px solid #000}
  .card{background:var(--face);border-right:2px solid #000;border-bottom:2px solid #000;padding:28px;display:flex;flex-direction:column;gap:20px}
  .card.dark{background:#141414;color:#E8E8E8}
  .stage{height:150px;display:flex;align-items:center;justify-content:center}
  .no{font-weight:900;font-size:20px}
  svg{display:block;max-width:100%}
  .jp{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;font-weight:900}
  .en{font-family:"Helvetica Neue",Helvetica,"Arial Black",Arial,sans-serif;font-weight:900}
  .small{display:flex;gap:16px;align-items:center}
</style>
</head>
<body>
<h1>LOL診断 ロゴ案</h1>
<div class="grid">

<!-- 1: WARDEXと同じ赤箱＋白文字 -->
<div class="card"><div class="no">1</div><div class="stage">
<svg viewBox="0 0 460 120" width="380"><rect width="460" height="120" fill="#FF1A1A"/>
<text x="230" y="62" text-anchor="middle" dominant-baseline="central" class="jp" font-size="74" fill="#fff" letter-spacing="2"><tspan class="en">LOL</tspan>診断</text></svg>
</div><div class="small">
<svg viewBox="0 0 32 32" width="48"><rect width="32" height="32" fill="#FF1A1A"/><text x="16" y="17" text-anchor="middle" dominant-baseline="central" class="en" font-size="13" fill="#fff">LOL</text></svg>
<svg viewBox="0 0 32 32" width="48"><rect width="32" height="32" fill="#FF1A1A"/><text x="16" y="17" text-anchor="middle" dominant-baseline="central" class="jp" font-size="22" fill="#fff">診</text></svg>
</div></div>

<!-- 2: LOLは赤箱、診断は黒文字 -->
<div class="card"><div class="no">2</div><div class="stage">
<svg viewBox="0 0 460 120" width="380"><rect x="0" y="10" width="210" height="100" fill="#FF1A1A"/>
<text x="105" y="62" text-anchor="middle" dominant-baseline="central" class="en" font-size="76" fill="#fff">LOL</text>
<text x="335" y="62" text-anchor="middle" dominant-baseline="central" class="jp" font-size="80" fill="#000">診断</text></svg>
</div></div>

<!-- 3: 英字のみ WARDEX と同じ字面 -->
<div class="card"><div class="no">3</div><div class="stage">
<svg viewBox="0 0 520 120" width="400"><rect width="520" height="120" fill="#FF1A1A"/>
<text x="260" y="62" text-anchor="middle" dominant-baseline="central" class="en" font-size="58" fill="#fff" letter-spacing="2">LOLSHINDAN</text></svg>
</div></div>

<!-- 4: 黒箱＋白文字、赤は「診断」の下線だけ -->
<div class="card"><div class="no">4</div><div class="stage">
<svg viewBox="0 0 460 120" width="380"><rect width="460" height="120" fill="#000"/>
<text x="230" y="58" text-anchor="middle" dominant-baseline="central" class="jp" font-size="74" fill="#fff" letter-spacing="2"><tspan class="en">LOL</tspan>診断</text>
<rect x="236" y="100" width="168" height="8" fill="#FF1A1A"/></svg>
</div></div>

<!-- 5: 箱なし 線囲み -->
<div class="card"><div class="no">5</div><div class="stage">
<svg viewBox="0 0 460 120" width="380"><rect x="3" y="3" width="454" height="114" fill="none" stroke="#000" stroke-width="6"/>
<text x="230" y="62" text-anchor="middle" dominant-baseline="central" class="jp" font-size="74" fill="#000" letter-spacing="2"><tspan class="en">LOL</tspan><tspan fill="#FF1A1A">診断</tspan></text></svg>
</div></div>

<!-- 6: 縦2段 LOL / 診断 -->
<div class="card"><div class="no">6</div><div class="stage">
<svg viewBox="0 0 200 200" width="150"><rect width="200" height="200" fill="#FF1A1A"/>
<text x="100" y="62" text-anchor="middle" dominant-baseline="central" class="en" font-size="72" fill="#fff">LOL</text>
<text x="100" y="142" text-anchor="middle" dominant-baseline="central" class="jp" font-size="76" fill="#fff">診断</text></svg>
</div></div>

<!-- 7: 黒版 1と同じ赤箱 -->
<div class="card dark"><div class="no">7</div><div class="stage">
<svg viewBox="0 0 460 120" width="380"><rect width="460" height="120" fill="#FF3333"/>
<text x="230" y="62" text-anchor="middle" dominant-baseline="central" class="jp" font-size="74" fill="#fff" letter-spacing="2"><tspan class="en">LOL</tspan>診断</text></svg>
</div></div>

<!-- 8: 黒版 文字だけ＋赤い四角の点 -->
<div class="card dark"><div class="no">8</div><div class="stage">
<svg viewBox="0 0 460 120" width="380">
<text x="20" y="62" dominant-baseline="central" class="jp" font-size="80" fill="#E8E8E8"><tspan class="en">LOL</tspan>診断</text>
<rect x="414" y="80" width="24" height="24" fill="#FF3333"/></svg>
</div></div>

</div>
</body>
</html>
