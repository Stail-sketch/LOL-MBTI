<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>フッター制作者表記ラウンド</title>
<!--
  design-rounds の比較ページ（フッターに制作者情報を入れる案）。ブラウザで開くだけで動く。
  - 各案はスマホ幅 390px の「結果画面の終わり〜フッター」を実寸で描く（フッターは主にスマホで見られるため）
  - アイコンは使われなくなった ../../creator-follow.webp から切り出した物（stail.jpg / justive.jpg）
  - Pick・★・メモはこのブラウザ（localStorage）にだけ保存。「選んだ案をコピー」の文章を会話に貼って次のラウンドへ
-->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f0f0f0; --ink: #0a0a0a; --red: #ff1a1a; --dim: rgba(10,10,10,.55); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, "Noto Sans JP", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 16px 24px 12px; border-bottom: 2px solid rgba(10,10,10,.08); }
  .rounds button { background: none; border: 0; font-weight: 800; letter-spacing: .3em; font-size: 13px; color: rgba(10,10,10,.3); cursor: pointer; padding: 0 12px 0 0; }
  .rounds button.on { color: var(--ink); }
  h1 { margin: 4px 0 8px; font-size: 28px; font-weight: 900; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { height: 32px; padding: 0 12px; font-weight: 800; font-size: 13px; border: 2px solid rgba(10,10,10,.2); background: none; cursor: pointer; color: var(--ink); }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .copy { margin-left: auto; height: 32px; padding: 0 16px; background: var(--red); color: #fff; border: 0; font-weight: 900; cursor: pointer; }
  main { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, 390px); gap: 40px 24px; justify-content: center; }
  .thumb { position: relative; overflow: hidden; outline: 2px solid rgba(10,10,10,.15); cursor: zoom-in; background: #010A13; }
  .thumb.pick { outline: 4px solid var(--red); }
  .stage { position: absolute; left: 0; top: 0; overflow: hidden; transform-origin: 0 0; background: #010A13; }
  .meta { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .no { font-weight: 900; font-size: 20px; }
  .tag { font-size: 12px; font-weight: 800; color: var(--dim); }
  .base { background: var(--ink); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 6px; }
  .star { margin-left: auto; background: none; border: 0; font-size: 20px; color: rgba(10,10,10,.25); cursor: pointer; }
  .star.on { color: var(--red); }
  .title { margin: 4px 0 0; font-weight: 900; font-size: 17px; }
  .note { margin: 2px 0 0; font-size: 13px; line-height: 1.6; color: rgba(10,10,10,.8); }
  textarea { width: 100%; margin-top: 8px; border: 2px solid rgba(10,10,10,.2); background: var(--bg); font: inherit; font-size: 13px; padding: 8px; resize: none; }
  .overall { max-width: 900px; margin: 48px auto 0; }
  .zoom { position: fixed; inset: 0; z-index: 10; background: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: zoom-out; }
  .zoom .frame { position: relative; overflow: hidden; }
  .zoom p { color: #fff; font-weight: 900; margin-top: 12px; }

  /* ===== 案の舞台の共通部品（本番 style.css の値を写したもの。名前は f- で比較ページと分ける） ===== */
  .stage { color: #F0E6BE; font-family: 'Noto Serif JP', serif; line-height: 1.8; }
  .stage a { color: inherit; text-decoration: none; }
  .f-ctx { padding: 32px 20px 0; text-align: center; }
  .f-share { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 32px; width: 260px; background: #000; color: #fff; font: 700 14px 'Rajdhani', sans-serif; letter-spacing: .15em; border: 1px solid rgba(255,255,255,.2); clip-path: polygon(8px 0%,calc(100% - 8px) 0%,100% 50%,calc(100% - 8px) 100%,8px 100%,0% 50%); }
  .f-x { width: 1em; height: 1em; fill: currentColor; flex-shrink: 0; }
  .f-foot { margin-top: 56px; padding: 40px 20px 32px; background: linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.8) 100%); border-top: 1px solid rgba(200,155,60,.25); text-align: center; display: flex; flex-direction: column; gap: 10px; }
  .f-foot::before { content: ''; display: block; width: 80%; height: 1px; background: linear-gradient(90deg,transparent,rgba(200,155,60,.45),transparent); margin: 0 auto 26px; }
  .f-disc { margin: 0; font-size: 11px; color: rgba(255,255,255,.45); line-height: 1.7; }
  .f-disc strong { color: rgba(200,155,60,.7); }
  .f-disc a, .f-priv a { color: rgba(200,155,60,.6) !important; text-decoration: underline !important; }
  .f-priv, .f-note { margin: 0; font-size: 10px; color: rgba(255,255,255,.3); line-height: 1.6; }
  .f-ic { display: block; object-fit: cover; }
</style>
</head>
<body>
<header>
  <div class="rounds" id="rounds"></div>
  <h1 id="theme"></h1>
  <div class="bar" id="bar"></div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <section class="overall">
    <div class="tag">全体の感想</div>
    <textarea id="overall" rows="4" placeholder="例: アイコンは要らない、名前だけで十分 / 免責の下に置きたい"></textarea>
  </section>
</main>
<style id="cand-css"></style>

    id: 17, title: "制作者は上、ロゴは一番下", note: "#01 を免責の上に置き、ロゴは注意書きのさらに下へ。サイトの「運営元」の位置", intensity: "chill", tags: ["WARDEX", "横並び", "一番下"],
    css: ROW + WCSS + `#S .row{margin-bottom:10px}#S .lg{margin-top:14px;padding-top:16px;border-top:1px solid rgba(200,155,60,.12)}`,
    html: page({ top: rowHtml(), bottom: `<div class="lg">${WL(20)}</div>` }),
  },
  {
    id: 18, title: "#12 の白文字版", note: "横並びの下に、背景なしの白い文字ロゴ。赤い面より静かで、紺の画面になじむ", intensity: "chill", tags: ["WARDEX白", "横並び"],
    css: ROW + WCSS + `#S .lg{margin:6px 0 12px}`,
    html: page({ top: rowHtml() + `<div class="lg">${WL(40, "white")}</div>` }),
  },
  {
    id: 19, title: "#14 の白文字版", note: "2列＋金の線の下に、白い文字ロゴを大きめに", intensity: "medium", tags: ["WARDEX白", "2列"],
    css: COLS + WCSS + `#S .lg{margin:14px auto 14px;padding-top:8px;width:70%;border-top:1px solid rgba(200,155,60,.18)}`,
    html: page({ top: colsHtml() + `<div class="lg">${WL(50, "white")}</div>` }),
  },
  {
    id: 20, title: "#17 の白文字版", note: "制作者は免責の上、白い文字ロゴは一番下。運営元の位置を静かに", intensity: "chill", tags: ["WARDEX白", "横並び", "一番下"],
    css: ROW + WCSS + `#S .row{margin-bottom:10px}#S .lg{margin-top:8px;padding-top:6px;border-top:1px solid rgba(200,155,60,.12)}#S .lg img.wl{opacity:.85}`,
    html: page({ top: rowHtml(), bottom: `<div class="lg">${WL(36, "white")}</div>` }),
  },
);

// ===== ROUND 3: 「LoLの攻略は＋WARDEXロゴ」の置き方だけを振る =====
// 文言は「攻略は」→「LoLの攻略は」に変更（2026-11-21 本人指定）
// ROUND 2 の結果: #14（2列＋区切り線＋赤ロゴ）に決定。「LoLの攻略は」をロゴの左に置き、2つをまとめて中央揃え（本人指定）
// 2人の2列と赤ロゴは固定。振るのは 線の扱い × 「LoLの攻略は」の大きさ・色・位置
const KO = `#S .ko{display:inline-flex;align-items:center;justify-content:center;gap:10px;color:#F0E6BE;font-size:14px;line-height:1}`;
const r3 = (id, title, note, intensity, tags, css, inner, where = "top") => ({
  id, title, note, intensity, tags,
  css: COLS + WCSS + KO + `#S .cols{margin-bottom:0}` + css,
  html: page(where === "top" ? { top: colsHtml() + inner } : { top: colsHtml() + `<div style="height:20px"></div>`, bottom: inner }),
});
ROUNDS.push({
  key: "r3",
  label: "ROUND 3",
  theme: "「LoLの攻略は WARDEX」の置き方",
  h: 720,
  items: [
    r3(1, "#14 に「LoLの攻略は」を足しただけ（基準）", "ROUND 2 の #14 の線とロゴの大きさのまま、左に「LoLの攻略は」。2つで中央揃え", "medium", ["基準", "線あり"],
      `#S .lg{margin:18px auto 22px;padding-top:18px;width:70%;border-top:1px solid rgba(200,155,60,.18)}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}</span></div>`),
    r3(2, "「LoLの攻略は」を小さく・薄く", "ロゴが主役。「LoLの攻略は」は12pxの薄い色で添えるだけ", "chill", ["線あり", "文字小"],
      `#S .lg{margin:18px auto 22px;padding-top:18px;width:70%;border-top:1px solid rgba(200,155,60,.18)}#S .ko{font-size:12px;color:rgba(255,255,255,.55);gap:8px}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}</span></div>`),
    r3(3, "「LoLの攻略は」を太く、ロゴと同じ高さに", "「LoLの攻略は」を16pxの太字にして、ロゴと並ぶ一言として読ませる", "medium", ["線あり", "文字大"],
      `#S .lg{margin:18px auto 22px;padding-top:18px;width:70%;border-top:1px solid rgba(200,155,60,.18)}#S .ko{font-size:16px;font-weight:700}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}</span></div>`),
    r3(4, "「LoLの攻略は」を金色に", "文字をサイトの金に。紺・金・赤の3色が1行に並ぶ", "medium", ["線あり", "金"],
      `#S .lg{margin:18px auto 22px;padding-top:18px;width:70%;border-top:1px solid rgba(200,155,60,.18)}#S .ko{color:#C89B3C;font-weight:700}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}</span></div>`),
    r3(5, "線を左右に伸ばして挟む", "——LoLの攻略は WARDEX——。線が見出しの飾りになり、区切りと一体になる", "medium", ["線で挟む"],
      `#S .lg{display:flex;align-items:center;gap:14px;margin:22px 0 24px}#S .lg::before,#S .lg::after{content:'';flex:1;height:1px;background:rgba(200,155,60,.25)}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(26)}</span></div>`),
    r3(6, "線なし、間を広く", "区切り線を外し、2人との間を余白だけで分ける", "chill", ["線なし"],
      `#S .lg{margin:30px 0 30px}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}</span></div>`),
    r3(7, "ロゴを大きく（36px）", "WARDEX への入口として目立たせる。線は同じ", "crazy", ["線あり", "ロゴ大"],
      `#S .lg{margin:18px auto 22px;padding-top:20px;width:76%;border-top:1px solid rgba(200,155,60,.18)}#S .ko{font-size:15px;gap:12px}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(36)}</span></div>`),
    r3(8, "ロゴを小さく（22px）", "クレジットの一部として控えめに。線も短く", "chill", ["線あり", "ロゴ小"],
      `#S .lg{margin:16px auto 20px;padding-top:16px;width:50%;border-top:1px solid rgba(200,155,60,.18)}#S .ko{font-size:12px;gap:8px}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(22)}</span></div>`),
    r3(9, "細い金の枠で囲む", "「LoLの攻略は WARDEX」を1つの押せる帯にする。サイトの六角形のボタンの形", "crazy", ["枠"],
      `#S .lg{margin:22px 0 24px}#S .ko{padding:10px 22px;border:1px solid rgba(200,155,60,.45);background:rgba(200,155,60,.06);clip-path:polygon(10px 0%,calc(100% - 10px) 0%,100% 50%,calc(100% - 10px) 100%,10px 100%,0% 50%)}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(26)}</span></div>`),
    r3(10, "右に「↗」を足す", "押すと外のサイトへ行くことを矢印で示す", "medium", ["線あり", "矢印"],
      `#S .lg{margin:18px auto 22px;padding-top:18px;width:70%;border-top:1px solid rgba(200,155,60,.18)}#S .ar{font-size:14px;color:rgba(255,255,255,.5)}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(28)}<span class="ar">↗</span></span></div>`),
    r3(11, "一番下に置く", "2人は免責の上のまま、「LoLの攻略は WARDEX」だけ注意書きの下へ", "chill", ["一番下"],
      `#S .lg{margin-top:12px;padding-top:18px;border-top:1px solid rgba(200,155,60,.12)}`,
      `<div class="lg"><span class="ko">LoLの攻略は${WL(26)}</span></div>`, "bottom"),
  ],
});
// ===== ここまで =====

let round = ROUNDS[ROUNDS.length - 1];
let filter = "all";
const store = (k) => `design-rounds:${location.pathname}:${k}`;
const load = (k) => { try { return JSON.parse(localStorage.getItem(store(k)) || "null"); } catch { return null; } };
const save = (k, v) => { try { localStorage.setItem(store(k), JSON.stringify(v)); } catch {} };
let marks = {};

function stageOf(c) {
  const s = document.createElement("div");
  s.className = "stage"; s.id = `c${round.key}-${c.id}`; s.innerHTML = c.html;
  s.style.width = SW + "px"; s.style.height = SH + "px";
  return s;
}

function render() {
  marks = load(round.key) || {};
  SH = round.h || 830;
  document.getElementById("theme").textContent = round.theme;
  document.getElementById("rounds").innerHTML = ROUNDS.map((r) => `<button class="${r === round ? "on" : ""}" data-r="${r.key}">${r.label}</button>`).join("");
  document.querySelectorAll("#rounds button").forEach((b) => (b.onclick = () => { round = ROUNDS.find((r) => r.key === b.dataset.r); render(); }));
  document.getElementById("cand-css").textContent = round.items.map((c) => c.css.replaceAll("#S", `#c${round.key}-${c.id}`)).join("\n");
  const bar = document.getElementById("bar");
  bar.innerHTML = ["all", "chill", "medium", "crazy", "pick", "star"].map((f) => `<button class="chip ${filter === f ? "on" : ""}" data-f="${f}">${{ all: "全部", chill: "控えめ", medium: "ふつう", crazy: "強め", pick: "Pick だけ", star: "★ だけ" }[f]}</button>`).join("")
    + `<button class="copy" id="copy">選んだ案をコピー（${round.items.filter((c) => marks[c.id]?.pick).length}）</button>`;
  bar.querySelectorAll(".chip").forEach((b) => (b.onclick = () => { filter = b.dataset.f; render(); }));
  document.getElementById("copy").onclick = copy;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  for (const c of round.items) {
    const m = marks[c.id] || {};
    if (["chill", "medium", "crazy"].includes(filter) && c.intensity !== filter) continue;
    if (filter === "pick" && !m.pick) continue;
    if (filter === "star" && !m.star) continue;
    const a = document.createElement("article");
    a.innerHTML = `<div class="thumb ${m.pick ? "pick" : ""}" style="width:${SW}px;height:${SH}px"></div>
      <div class="meta"><span class="no">#${String(c.id).padStart(2, "0")}</span><span class="tag">${{ chill: "控えめ", medium: "ふつう", crazy: "強め" }[c.intensity]}</span>${c.base ? `<span class="base">今の本番</span>` : ""}
        <button class="star ${m.star ? "on" : ""}">★</button><button class="chip ${m.pick ? "on" : ""}">Pick</button></div>
      <p class="title"></p><div class="tag tags"></div><p class="note"></p>`;
    a.querySelector(".title").textContent = c.title;
    a.querySelector(".tags").textContent = (c.tags || []).join(" · ");
    a.querySelector(".note").textContent = c.note;
    const thumb = a.querySelector(".thumb"); thumb.appendChild(stageOf(c)); thumb.onclick = () => big(c);
    a.querySelector(".star").onclick = () => mark(c.id, { star: !m.star });
    a.querySelector(".meta .chip").onclick = () => mark(c.id, { pick: !m.pick });
    if (m.pick || m.star) {
      const t = document.createElement("textarea"); t.rows = 2; t.placeholder = "どこが良いか／直したい所"; t.value = m.memo || "";
      t.oninput = () => { marks[c.id] = { ...marks[c.id], memo: t.value }; save(round.key, marks); };
      a.appendChild(t);
    }
    grid.appendChild(a);
  }
  const ov = document.getElementById("overall");
  ov.value = load(round.key + ":overall") || "";
  ov.oninput = () => save(round.key + ":overall", ov.value);
}

function mark(id, patch) { marks[id] = { ...marks[id], ...patch }; save(round.key, marks); render(); }

function big(c) {
  const s = Math.min((innerWidth - 64) / SW, (innerHeight - 80) / SH, 2);
  const d = document.createElement("div"); d.className = "zoom";
  d.innerHTML = `<div class="frame" style="width:${SW * s}px;height:${SH * s}px"></div><p></p>`;
  d.querySelector("p").textContent = `#${String(c.id).padStart(2, "0")} ${c.title}（クリックか Esc で閉じる）`;
  const st = stageOf(c); st.style.transform = `scale(${s})`; d.querySelector(".frame").appendChild(st);
  const close = () => { d.remove(); removeEventListener("keydown", esc); };
  const esc = (e) => e.key === "Escape" && close();
  d.onclick = close; addEventListener("keydown", esc); document.body.appendChild(d);
}

async function copy() {
  const line = (c) => { const memo = (marks[c.id]?.memo || "").trim(); return `- #${String(c.id).padStart(2, "0")} ${c.title}（${(c.tags || []).join("・")}）${memo ? `: ${memo}` : ""}`; };
  const picks = round.items.filter((c) => marks[c.id]?.pick);
  const stars = round.items.filter((c) => marks[c.id]?.star && !marks[c.id]?.pick);
  const overall = (load(round.key + ":overall") || "").trim();
  const text = [`デザイン候補 ${round.label} ${round.theme} の選択結果`, "", "Pick:", ...(picks.length ? picks.map(line) : ["- なし"]),
    ...(stars.length ? ["", "気になる（スター）:", ...stars.map(line)] : []), ...(overall ? ["", "全体の感想:", overall] : [])].join("\n");
  try { await navigator.clipboard.writeText(text); document.getElementById("copy").textContent = "コピーしました"; setTimeout(render, 1200); } catch { prompt("コピーしてください", text); }
}

render();
</script>
