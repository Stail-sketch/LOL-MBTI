<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 作る側が数字を見るためのページ。検索結果には出さない -->
<meta name="robots" content="noindex,nofollow">
<title>LOL診断 集計</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+JP:wght@400;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<script>
  // 見た目は WARDEX の黒版（既定）と、診断本体と同じ金と紺（?design=lol）を切り替えられる。選んだ方は次に開いた時も使う。
  // 描画の前に決めて、一瞬だけ別の見た目が出るのを防ぐ
  (function(){
    var q=new URLSearchParams(location.search).get('design'),d=q;
    if(!d){try{d=localStorage.getItem('stats-design');}catch(e){}}
    document.documentElement.dataset.design=d==='lol'?'lol':'wardex';
  })();
</script>
<style>
  /* 既定は WARDEX デザインの黒版。遊ぶ人に見せるページではないため。下の [data-design="lol"] が診断本体（vars.css・style.css）に合わせた見た目 */
  :root{--bg:#141414;--surface:#1C1C1C;--surface2:#242424;--text:#E8E8E8;--sub:#9A9A9A;--line:rgba(255,255,255,.18);--accent:#FF3333}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:Helvetica,Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-weight:700;line-height:1.4;-webkit-font-smoothing:antialiased}
  main{max-width:960px;margin:0 auto;padding:32px 16px 80px}
  header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}
  h1{font-size:22px;letter-spacing:.02em}
  button{font:inherit;font-size:13px;color:var(--text);background:none;border:1px solid var(--text);border-radius:999px;padding:8px 18px;cursor:pointer}
  button:hover{background:var(--text);color:var(--bg)}
  .nums{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
  .num{padding:28px 0}
  .num+.num{border-left:1px solid var(--line);padding-left:24px}
  .num dt{font-size:13px;color:var(--sub)}
  .num dd{font-size:56px;line-height:1.1;font-variant-numeric:tabular-nums;margin-top:6px}
  .num dd small{font-size:20px;margin-left:2px}
  .num.rate dd{color:var(--accent)}
  .num p{font-size:12px;color:var(--sub);font-weight:400;margin-top:6px}
  h2{font-size:15px;margin:40px 0 12px}
  .row{display:grid;grid-template-columns:96px 1fr 132px;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
  .row:last-child{border-bottom:1px solid var(--line)}
  .row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .val{text-align:right;white-space:nowrap}
  .row .val span{color:var(--sub);font-weight:400;margin-left:8px}
  .bar{position:relative;height:14px;border:1px solid var(--line)}
  .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--text)}
  .bar.plain{border:0}
  .head{display:grid;grid-template-columns:96px 1fr 132px;gap:12px;font-size:12px;color:var(--sub);font-weight:400;padding-bottom:8px}
  .head div:last-child{text-align:right}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 40px}
  .wide .row,.wide .head{grid-template-columns:150px 1fr 100px}
  .judge{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:40px}
  .judge button.on{background:var(--text);color:var(--bg)}
  .judge span{font-size:13px;color:var(--sub);font-weight:400;margin-left:8px;font-variant-numeric:tabular-nums}
  #error{color:var(--accent);padding:24px 0;display:none}
  header .tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  .design{display:flex;gap:0}
  .design button+button{margin-left:-1px}
  .design button.on{background:var(--text);color:var(--bg)}

  /* 診断本体の見た目（vars.css の色、Cinzel・Noto Serif JP・Rajdhani、金の線と六角のボタン） */
  [data-design="lol"]{--bg:#010A13;--surface:#0A1428;--text:#F0E6BE;--sub:#A09B8C;--line:rgba(200,155,60,.2);--accent:#0BC4E3;--gold:#C89B3C;--gold-dark:#785A28}
  [data-design="lol"] body{font-family:'Noto Serif JP',serif;font-weight:400;line-height:1.6;background:radial-gradient(ellipse at 50% 0%,#0A1428 0%,#010A13 70%) fixed}
  [data-design="lol"] h1{font-family:'Cinzel','Noto Serif JP',serif;font-weight:700;color:var(--gold);letter-spacing:.12em;text-shadow:0 0 24px rgba(200,155,60,.45)}
  [data-design="lol"] h2{font-family:'Cinzel','Noto Serif JP',serif;font-weight:700;color:var(--gold);letter-spacing:.14em}
  [data-design="lol"] button{font-family:'Cinzel','Noto Serif JP',serif;color:var(--gold);border:1px solid var(--gold-dark);border-radius:0;padding:8px 22px;letter-spacing:.08em;clip-path:polygon(8px 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,8px 100%,0 50%);transition:background .2s,color .2s}
  [data-design="lol"] button:hover,[data-design="lol"] .judge button.on,[data-design="lol"] .design button.on{background:linear-gradient(135deg,var(--gold-dark),var(--gold) 50%,var(--gold-dark));color:var(--bg)}
  [data-design="lol"] .design button+button{margin-left:-4px}
  [data-design="lol"] .num dt{color:var(--sub);letter-spacing:.1em}
  [data-design="lol"] .num dd{font-family:'Rajdhani',sans-serif;font-weight:700;color:var(--gold);text-shadow:0 0 20px rgba(200,155,60,.4)}
  [data-design="lol"] .num.rate dd{color:var(--accent);text-shadow:0 0 20px rgba(11,196,227,.4)}
  [data-design="lol"] .row{background:rgba(0,0,0,.25);border:1px solid rgba(200,155,60,.12);padding:8px 12px;margin-top:6px}
  [data-design="lol"] .row:last-child{border-bottom:1px solid rgba(200,155,60,.12)}
  [data-design="lol"] .row .val{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;color:var(--gold)}
  [data-design="lol"] .row .val span{font-family:'Rajdhani',sans-serif;color:var(--sub)}
  [data-design="lol"] .bar{height:6px;border:0;border-radius:3px;background:rgba(200,155,60,.15)}
  [data-design="lol"] .bar.plain{background:none}
  [data-design="lol"] .bar i{border-radius:3px;background:linear-gradient(to right,var(--gold-dark),var(--gold));box-shadow:0 0 10px rgba(200,155,60,.4)}
  [data-design="lol"] .head{padding:0 12px 4px}
  [data-design="lol"] .judge span{font-family:'Rajdhani',sans-serif;font-size:15px;color:var(--gold)}

  @media(max-width:640px){
    .num dd{font-size:36px}.num+.num{padding-left:14px}
    .cols{grid-template-columns:1fr}
    .row,.head{grid-template-columns:76px 1fr 108px}
    .wide .row,.wide .head{grid-template-columns:110px 1fr 88px}
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>LOL診断 集計</h1>
    <div class="tools">
      <div class="design" id="design">
        <button data-d="wardex">WARDEX</button>
        <button data-d="lol">診断ページ</button>
      </div>
      <button id="reload">更新</button>
    </div>
  </header>
  <p id="error">集計を読み込めませんでした</p>

  <dl class="nums">
    <div class="num"><dt>16問</dt><dd id="n16">–</dd><p id="since16"></p></div>
    <div class="num"><dt>32問</dt><dd id="n32">–</dd><p id="since32"></p></div>
    <div class="num rate"><dt>32問まで進んだ割合</dt><dd id="rate">–</dd><p id="rate-note"></p></div>
  </dl>

  <div class="judge" id="period">
    <button data-p="day" class="on">日ごと</button>
    <button data-p="hour">時間ごと</button>
  </div>
  <div class="head" style="margin-top:16px"><div id="period-label">日付</div><div>枠＝16問　塗り＝32問</div><div>16問 / 32問</div></div>
  <div id="days"></div>

  <div class="judge" id="judge">
    <button data-j="all" class="on">全期間</button>
    <button data-j="1">調整前</button>
    <button data-j="2">調整後</button>
    <span id="judge-n"></span>
  </div>

  <div class="cols">
    <section class="wide"><h2>タイプ</h2><div id="types"></div></section>
    <section class="wide"><h2>ロール</h2><div id="roles"></div></section>
  </div>
  <section class="wide"><h2>チャンピオン</h2><div class="cols" id="champs"></div></section>
</main>

<script src="js/worker-config.js?v=8"></script>
<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;};
const fmt=n=>n.toLocaleString('ja-JP');
// タイプ名は記録時に < > & を文字参照へ置き換えて保存しているので、表示の前に戻す
const decode=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&amp;/g,'&');

function row(name,ratio,value,sub,plain){
  const r=el('div','row');
  r.append(el('div','name',name));
  const bar=el('div','bar'+(plain?' plain':''));
  const fill=el('i');fill.style.width=Math.max(0,Math.min(100,ratio*100))+'%';
  bar.append(fill);r.append(bar);
  const v=el('div','val',value);if(sub)v.append(el('span','',sub));
  r.append(v);
  return r;
}

function renderList(target,list,total){
  target.replaceChildren();
  const max=list.length?list[0][1]:1;
  for(const [name,n] of list){
    target.append(row(decode(name),n/max,fmt(n),total?(n/total*100).toFixed(1)+'%':'',true));
  }
}

// 判定を変えた前後で分けて見る。全期間は counts の通算、調整前・調整後は answers 表の内訳（Worker の /stats の judges）。
// 1＝2026-11-22 のチューニング前、2＝後（js/diagnosis.js の JUDGE_VERSION）
let judge='all',last=null;
$('judge').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  judge=b.dataset.j;
  $('judge').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(last)renderBreakdown(last);
});

function render(d){
  last=d;
  // 16問の回数を数え始めた日より後だけで割合を出す（それより前は32問しか数えていない）
  const days=d.days||[];
  const counted=days.filter(x=>x.n16>0);
  const sum16=counted.reduce((a,x)=>a+x.n16,0);
  const sum32=counted.reduce((a,x)=>a+x.n32,0);
  $('n16').textContent=fmt(sum16);
  $('n32').textContent=fmt(d.total);
  $('since16').textContent=counted.length?counted[0].day+' から':'';
  $('since32').textContent='2026-11-21 の数え直しから';
  $('rate').replaceChildren(sum16?(sum32/sum16*100).toFixed(1):'–',el('small','',sum16?'%':''));
  $('rate-note').textContent=sum16?fmt(sum32)+' / '+fmt(sum16)+'（16問を数え始めてからの分）':'';

  renderPeriod(d);
  renderBreakdown(d);
}

// 日ごと／時間ごと（時間ごとは Worker が数え始めた 2026-11-22 夜から、直近48時間）
let period='day';
$('period').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  period=b.dataset.p;
  $('period').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  if(last)renderPeriod(last);
});

function renderPeriod(d){
  const hourly=period==='hour';
  const list=(hourly?d.hours:d.days)||[];
  $('period-label').textContent=hourly?'時刻':'日付';
  const label=x=>hourly?x.hour.slice(5,10).replace('-','/')+' '+x.hour.slice(11)+'時':x.day.slice(5).replace('-','/');
  const box=$('days');box.replaceChildren();
  const max=Math.max(1,...list.map(x=>Math.max(x.n16,x.n32)));
  for(const x of list.slice().reverse()){
    const r=row(label(x),0,fmt(x.n16)+' / '+fmt(x.n32),x.n16?Math.round(x.n32/x.n16*100)+'%':'');
    const bar=r.querySelector('.bar');
    bar.style.width=Math.max(x.n16,x.n32)/max*100+'%';
    bar.firstChild.style.width=(x.n16?Math.min(1,x.n32/x.n16):1)*100+'%';
    box.append(r);
  }
}

function renderBreakdown(all){
  const d=judge==='all'?all:((all.judges||{})[judge]||{total:0,champions:[],types:[],roles:[]});
  $('judge-n').textContent=fmt(d.total)+'件';
  renderList($('types'),d.types,d.total);
  renderList($('roles'),d.roles,d.total);
  // チャンピオンは数が多いので2列に分ける
  const half=Math.ceil(d.champions.length/2);
  const left=el('div'),right=el('div');
  renderList(left,d.champions.slice(0,half),d.total);
  renderList(right,d.champions.slice(half),d.total);
  const max0=d.champions.length?d.champions[0][1]:1;
  right.querySelectorAll('.row').forEach((r,i)=>{r.querySelector('i').style.width=d.champions[half+i][1]/max0*100+'%';});
  $('champs').replaceChildren(left,right);
}

function load(){
  // ?api= は手元の worker で確かめる時用
  const api=new URLSearchParams(location.search).get('api')||WORKER_URL;
  fetch(api+'/stats').then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(d=>{$('error').style.display='none';render(d);})
    .catch(e=>{console.error(e);$('error').style.display='block';});
}
$('reload').addEventListener('click',load);

function setDesign(d){
  document.documentElement.dataset.design=d;
  $('design').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.d===d));
  try{localStorage.setItem('stats-design',d);}catch(e){}
  // URL にも残して、その見た目のまま人に渡せるようにする
  const u=new URL(location.href);
  if(d==='lol')u.searchParams.set('design','lol');else u.searchParams.delete('design');
  history.replaceState(null,'',u);
}
$('design').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setDesign(b.dataset.d);});
setDesign(document.documentElement.dataset.design);
load();
</script>
</body>
</html>
